# Local development only. Activate explicitly with SPRING_PROFILES_ACTIVE=dev.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:appointment;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

