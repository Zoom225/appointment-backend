# Runtime configuration only; no embedded database or shared secret fallback.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Preserve existing schema management until the dedicated Flyway migration issue.
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${JWT_SECRET}
app.frontend.url=${APP_FRONTEND_URL:${FRONTEND_URL:}}
app.cors.frontend-url=${app.frontend.url}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Demo credentials are required only when explicitly enabled.
app.demo.user.password=${APP_DEMO_USER_PASSWORD:}
app.demo.admin.password=${APP_DEMO_ADMIN_PASSWORD:}
