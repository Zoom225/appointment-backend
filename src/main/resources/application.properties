spring.application.name=appointment-backend
server.port=${PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:appointment;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.jpa.open-in-view=false

app.demo.enabled=${APP_DEMO_ENABLED:false}
app.demo.email=${APP_DEMO_EMAIL:demo@gestion-rendez-vous.com}
app.demo.password=${APP_DEMO_PASSWORD:Demo2026!}
app.demo.first-name=${APP_DEMO_FIRST_NAME:Demo}
app.demo.last-name=${APP_DEMO_LAST_NAME:Recruiter}

springdoc.swagger-ui.path=/swagger-ui.html

app.frontend.url=${APP_FRONTEND_URL:}
app.jwt.secret=${JWT_SECRET:VGhpcy1kZWZhdWx0LXNlY3JldC1tdXN0LWJlLXN1YnN0aXR1dGVkLWF0LXByb2R1Y3Rpb24=}
app.jwt.expiration=${JWT_EXPIRATION:PT2H}

appointment.availability.workday-start=09:00
appointment.availability.workday-end=18:00
appointment.availability.slot-minutes=30
appointment.availability.working-days=MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY

appointment.notifications.reminder-minutes-before=60
appointment.notifications.reminder-check-ms=60000

